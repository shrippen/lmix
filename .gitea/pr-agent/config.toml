# PR-Agent settings for lmix (.gitea/workflows/pr-agent.yml); the rest
# are PR-Agent's defaults.
[config]
git_provider = "gitea"
response_language = "de-DE"
max_model_tokens = 128000
fallback_models = []
publish_output_progress = false
# Claude Opus 4.7+ and Claude 5 take no temperature, only adaptive thinking
# with an effort (Opus 5.5 defaults to medium). Other models ignore both.
enable_claude_adaptive_thinking = true
reasoning_effort = "high"
# The repository rules go along as context.
repo_context_files = ["agent.md"]

[pr_reviewer]
num_max_findings = 5
require_can_be_split_review = true
enable_review_labels_effort = false
enable_review_labels_security = false
extra_instructions = """
You review pull requests of lmix, a live video mixer: lmix-core (Rust,
control process, HTTP/WS/TCP/OSC/MIDI), lmix-types, console-qt (Qt/QML via
cxx-qt), selftest, and strom (GStreamer engine, a submodule; its own PRs).
The PRs are written by an AI agent; review them as a careful second
reader, not as their author.

Report only findings that matter:
- Bugs: a concrete input or state and the wrong result or crash it gives.
  Name file and line.
- Security: anything reachable from the network (API, web pages, TCP,
  OSC) without the checks it needs.
- Missing tests for new behaviour, and docs (docs/DECISIONS, ROADMAP,
  HARDWARE-TODO) that the change made wrong.
- Breaches of the repository rules (agent.md).

Skip style, naming and formatting (rustfmt and clippy run separately),
praise, and guesses you cannot back with the diff. When you find
nothing that matters, say so in one line.
"""
