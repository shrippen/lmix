name: vm-check

# End-to-end check of lmix-core against a real strom (CPU mixer, no GPU):
# switching, sound, sources, outputs, failover and the latency budget
# (scripts/test-m2b-vm.sh). The latency regression check of ROADMAP 3.4.
#
# Uses the prebuilt strom package (strom.yml); without one for the
# submodule commit it builds strom here (slow).
on:
  push:
    paths:
      - workspace/lmix-core/**
      - workspace/lmix-types/**
      - workspace/console-qt/**
      - workspace/selftest/**
      - workspace/strom
      - scripts/test-m2b-vm.sh
      - .gitea/workflows/vm-check.yml
  workflow_dispatch:

concurrency:
  group: vm-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm-check:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git curl ca-certificates \
            jq zstd nodejs imagemagick xvfb ffmpeg build-essential mold clang pkg-config \
            libssl-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-gl gstreamer1.0-nice \
            libnice-dev libcairo2-dev
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Otherwise checkout's own header for git.arianw.de wins over
          # REGISTRY_TOKEN below, and the Actions token cannot read strom.
          persist-credentials: false

      # Private submodule: see strom.yml.
      - name: strom submodule
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          git config --global --add safe.directory '*'
          git -c http.extraheader="Authorization: token $TOKEN" \
            submodule update --init --depth 50 workspace/strom

      # utoipa-swagger-ui's build script downloads Swagger UI from GitHub
      # once, without retry; a broken download stops the strom build when
      # fetch-strom.sh finds no package. Fetch it here with retries and hand
      # the crate the file. Version: the default of utoipa-swagger-ui 9.0.
      - name: Swagger UI
        run: |
          curl -sSfL --retry 5 --retry-all-errors -o "$PWD/swagger-ui.zip" \
            https://github.com/swagger-api/swagger-ui/archive/refs/tags/v5.17.14.zip
          echo "SWAGGER_UI_DOWNLOAD_URL=file://$PWD/swagger-ui.zip" >> "$GITHUB_ENV"

      - name: VM check
        env:
          GITEA_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          RUSTFLAGS: -C link-arg=-fuse-ld=mold
          WORK: ${{ github.workspace }}/vm-work
          KEEP_WORK: 1
        run: |
          . "$HOME/.cargo/env"
          scripts/test-m2b-vm.sh

      # Logs and pictures of a failed run.
      - name: Keep the work folder
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: vm-work
          path: vm-work
          retention-days: 7
