name: strom

# Builds the strom engine once per submodule commit and stores the binary
# as a Gitea generic package, so sessions download it in seconds instead
# of compiling for 20+ minutes (scripts/fetch-strom.sh).
#
# Built in ubuntu:24.04: the binary links the system GStreamer, so it runs
# where the same libraries are installed (cloud VM, Ubuntu 24.04 hosts).
on:
  push:
    branches: [main]
    paths:
      - workspace/strom
      - .gitea/workflows/strom.yml
  pull_request:
    paths:
      - workspace/strom
      - .gitea/workflows/strom.yml
  workflow_dispatch:

concurrency:
  group: strom-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_URL: ${{ github.server_url }}/api/packages/${{ github.repository_owner }}/generic/strom
  FILE: strom-ubuntu24.04-x86_64.tar.zst

jobs:
  build:
    # Shares the group of vm-check: a strom build next to a VM check starves
    # the CPU mixer, and the check gets the package once the build is done.
    concurrency:
      group: vm-check
      cancel-in-progress: false
    timeout-minutes: 120
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Tools
        run: |
          apt-get update -qq
          apt-get install -y -qq git curl ca-certificates jq zstd nodejs

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Otherwise checkout's own header for git.arianw.de wins over
          # REGISTRY_TOKEN below, and the Actions token cannot read strom.
          persist-credentials: false

      # The submodule is a private repository: the Actions token cannot read
      # it, REGISTRY_TOKEN (read:repository, write:package) can.
      - name: strom submodule
        id: strom
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          git config --global --add safe.directory '*'
          git -c http.extraheader="Authorization: token $TOKEN" \
            submodule update --init --depth 50 workspace/strom
          echo "sha=$(git -C workspace/strom rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Already built?
        id: exists
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: token $TOKEN" \
            "$PACKAGE_URL/${{ steps.strom.outputs.sha }}/$FILE")
          echo "found=$([ "$code" = 200 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Build dependencies
        if: steps.exists.outputs.found == 'no'
        run: |
          apt-get install -y -qq build-essential pkg-config clang mold libssl-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libnice-dev libcairo2-dev
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none

      # utoipa-swagger-ui's build script downloads Swagger UI from GitHub
      # once, without retry; a broken download stops the strom build (run
      # 2433). Fetch it here with retries and hand the crate the file.
      # Version: the default of utoipa-swagger-ui 9.0.
      - name: Swagger UI
        if: steps.exists.outputs.found == 'no'
        run: |
          curl -sSfL --retry 5 --retry-all-errors -o "$PWD/swagger-ui.zip" \
            https://github.com/swagger-api/swagger-ui/archive/refs/tags/v5.17.14.zip
          echo "SWAGGER_UI_DOWNLOAD_URL=file://$PWD/swagger-ui.zip" >> "$GITHUB_ENV"

      - name: Build strom
        if: steps.exists.outputs.found == 'no'
        working-directory: workspace/strom
        env:
          RUSTFLAGS: -C link-arg=-fuse-ld=mold
        run: |
          . "$HOME/.cargo/env"
          cargo build --release --features no-gui --bin strom

      - name: Upload package
        if: steps.exists.outputs.found == 'no'
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          tar -C workspace/strom/target/release -c strom | zstd -19 -T0 > "$FILE"
          code=$(curl -sS -o upload.txt -w '%{http_code}' -X PUT \
            -H "Authorization: token $TOKEN" --upload-file "$FILE" \
            "$PACKAGE_URL/${{ steps.strom.outputs.sha }}/$FILE")
          echo "HTTP $code"; cat upload.txt; echo
          [ "$code" -lt 400 ]
