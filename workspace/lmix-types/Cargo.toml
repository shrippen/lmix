[package]
name = "lmix-types"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Shared API types of lmix-core and its clients"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
schemars = { version = "1", features = ["uuid1"] }
thiserror = "2"
