[package]
name = "lmix-script"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Cue lists from Markdown scripts (show mode, IMP), loaded through lmix-core's API"

[dependencies]
lmix-types = { path = "../lmix-types" }

clap = { version = "4", features = ["derive", "env"] }
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
schemars = "1"
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v5"] }
