[package]
name = "fake-portal"
version = "0.1.0"
edition = "2021"
description = "Test stand-in for the desktop's GlobalShortcuts portal"
publish = false

[dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-std", "io-util"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
